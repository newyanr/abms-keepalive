name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake service
        run: |
          curl -sS -m 90 -w "\nHTTP %{http_code} time %{time_total}s\n" \
            https://abms-cloud.orkestr.run/__ping || true
